<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
    <title>Calculadora de Comissao</title>
</head>

<body>
    <main>
        <form class="container">
            <h2 class="Titulo">Calculadora de Comissão</h2>
            <input id="caixa-nome" class="caixa-texto" type="text" placeholder="Digite seu nome">
            <input id="caixa-valor" class="caixa-texto" type="number" placeholder="Digite o valor de vendas">
            <button id="botao-calcular" class="botao-calcular" type="button">Calcula Salário</button>
            <div id= "resultado" class="resultado">Resultado aparecerá aqui!</div>
        </form>
    </main>
</body>

</html>

</html>
